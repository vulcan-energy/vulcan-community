name: CLA

# Records individual CLA acceptance on a contributor's first pull request.
# Fork PRs from unknown contributors must never reach a self-hosted runner, so
# this job stays on GitHub-hosted ubuntu. pull_request_target runs with write
# permission on the base repository: never check out PR code in this workflow.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the Vulcan Community Individual Contributor License Agreement and I hereby sign it'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/vulcan-energy/vulcan-community/blob/main/CLA-INDIVIDUAL.md
          path-to-signatures: signatures/v1.1/cla.json
          branch: cla-signatures
          allowlist: baziyer,dependabot[bot]
          custom-pr-sign-comment: I have read the Vulcan Community Individual Contributor License Agreement and I hereby sign it
          custom-notsigned-prcomment: >-
            Thank you for the contribution. Before we can merge code, each
            author needs to accept the
            [Individual Contributor License Agreement](https://github.com/vulcan-energy/vulcan-community/blob/main/CLA-INDIVIDUAL.md)
            — you keep ownership of your work. Read it, then reply to this pull
            request with the acceptance statement below, exactly, from your own
            account. If an employer owns or may own your contribution, an
            authorised representative must instead complete the entity agreement
            by email — see
            [CONTRIBUTING.md](https://github.com/vulcan-energy/vulcan-community/blob/main/CONTRIBUTING.md).
