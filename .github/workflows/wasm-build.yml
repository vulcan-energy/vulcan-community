name: WASM build

# The model WASM build is the most fragile documented workflow: it needs a
# nightly toolchain, rust-src, the wasm32 target and a pinned wasm-pack. The
# main CI never exercises it, so this workflow catches toolchain rot before
# users following README.md#run-locally do.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  pull_request:
    paths:
      - '.github/workflows/wasm-build.yml'
      - 'scripts/build-model-wasm.sh'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'third_party/jsonschema-0.46.5-offline/**'
      - 'apps/cli/**'

permissions:
  contents: read

concurrency:
  group: wasm-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The registry, git dependencies and target directory. Registry sources are left
      # out; cargo unpacks them again from registry/cache.
      CARGO_CACHE_PATHS: |
        ~/.cargo/registry/index/
        ~/.cargo/registry/cache/
        ~/.cargo/git/db/
        ~/.cargo/git/checkouts/
        target/
    steps:
      # Third-party code is pinned to a full commit SHA rather than a mutable tag.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch; the toolchain input pins the nightly
        id: toolchain
        with:
          # Keep equal to wasm_toolchain in scripts/build-model-wasm.sh.
          toolchain: nightly-2026-05-22
          components: rust-src
          targets: wasm32-unknown-unknown

      # Pull requests restore the registry and compiled dependencies. Scheduled and
      # manual runs only look the cache up, so the weekly check still builds every
      # dependency from scratch; they save it when it is missing, which seeds the
      # cache pull requests read. No restore-keys: a new Cargo.lock, toolchain or
      # build script starts a clean cache instead of growing an old one.
      - name: Restore the Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CARGO_CACHE_PATHS }}
          key: wasm-build-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'scripts/build-model-wasm.sh') }}
          lookup-only: ${{ github.event_name != 'pull_request' }}

      # The prebuilt release binary, checked against the SHA-256 of
      # wasm-pack-v0.14.0-x86_64-unknown-linux-musl.tar.gz (also the asset digest
      # GitHub records for the release), instead of a 60-80 s cargo install.
      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: 0.14.0
          WASM_PACK_SHA256: 278a8d668085821f4d1a637bd864f1713f872b0ae3a118c77562a308c0abfe8d
        run: |
          set -euo pipefail
          name="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          dir="$RUNNER_TEMP/wasm-pack"
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --retry 3 --output "$dir/$name.tar.gz" \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/$name.tar.gz"
          echo "$WASM_PACK_SHA256  $dir/$name.tar.gz" | sha256sum --check --strict
          tar -xzf "$dir/$name.tar.gz" -C "$dir" --strip-components=1 "$name/wasm-pack"
          test "$("$dir/wasm-pack" --version)" = "wasm-pack $WASM_PACK_VERSION"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Build the Community model WASM
        run: ./scripts/build-model-wasm.sh

      - name: Save the Cargo cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CARGO_CACHE_PATHS }}
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # The CLI copies the WASM next to its bundle; main CI builds it without one.
      - name: Build the CLI with the WASM
        run: npm run build -w apps/cli

      - name: Smoke the CLI convert and preflight
        run: |
          fixture=crates/vulcan-model-wasm/tests/fixtures/min_working.csv
          defaults=data/defaults/defaults_template.json
          check='const r = JSON.parse(require("fs").readFileSync(0, "utf8")); process.exit(r[process.argv[1]].is_valid ? 0 : 1)'
          node apps/cli/dist/cli.js convert "$fixture" --defaults "$defaults" --json | node -e "$check" validation
          node apps/cli/dist/cli.js preflight "$fixture" --defaults "$defaults" --json | node -e "$check" preflight

      # The CLI tests that need the model WASM (HEM:EPC new build and existing building).
      - name: Test the CLI with the WASM
        run: npx vitest run apps/cli
